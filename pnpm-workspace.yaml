packages:
  - 'packages/*'
  - 'apps/*'
  - 'tools/*'

# One version per tool, referenced from every package as `"catalog:"`.
# A single edit here moves the whole workspace — and drift becomes impossible.
catalog:
  '@fastify/rate-limit': ^11
  '@fastify/static': ^10
  '@opentelemetry/api': ^1.9
  '@opentelemetry/context-async-hooks': ^2
  '@opentelemetry/exporter-trace-otlp-http': ^0.221.0
  '@opentelemetry/sdk-trace-base': ^2
  '@opentelemetry/sdk-trace-node': ^2
  fastify: ^5
  pg: ^8
  pino: ^9
  pixi.js: ^8
  tsx: ^4
  typescript: ^5
  vite: ^8
  vitest: ^3
  zod: ^4
