<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aurora Reels — demo</title>
    <style>
      :root {
        color-scheme: dark;
        --backdrop: #0b1020;
        --text: #e8ecf8;
        --muted: #8d97b8;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--backdrop);
        color: var(--text);
        font-family:
          'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', system-ui, sans-serif;
        overscroll-behavior: none;
      }

      #game {
        position: fixed;
        inset: 0;
      }

      #game canvas {
        display: block;
      }

      /* The loading state is DOM rather than canvas on purpose: it has to be visible before Pixi,
         the atlas or the session exist — which is exactly the window it covers. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: var(--backdrop);
        transition: opacity 240ms ease;
      }

      #boot[hidden] {
        display: none;
      }

      #boot.done {
        opacity: 0;
        pointer-events: none;
      }

      .spinner {
        width: 42px;
        height: 42px;
        border: 3px solid #2c3860;
        border-top-color: #39d98a;
        border-radius: 50%;
        animation: turn 900ms linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }

      @keyframes turn {
        to {
          transform: rotate(1turn);
        }
      }

      #boot-status,
      .notice {
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .notice {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(10px, env(safe-area-inset-bottom));
        text-align: center;
        font-size: 11px;
        pointer-events: none;
      }

      #boot-error {
        max-width: 34ch;
        text-align: center;
        color: #ff6b6b;
        font-size: 13px;
        line-height: 1.5;
        text-transform: none;
        letter-spacing: 0;
      }

      /* A real button, not a sprite: sound is a platform preference, and a DOM control gets focus,
         Enter/Space and a place in the accessibility tree for free. */
      #sound-toggle {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        right: max(10px, env(safe-area-inset-right));
        z-index: 5;
        padding: 8px 14px;
        border: 1px solid #2c3860;
        border-radius: 999px;
        background: rgba(16, 24, 48, 0.8);
        color: var(--muted);
        font: 600 11px/1 inherit;
        letter-spacing: 0.12em;
        cursor: pointer;
      }

      #sound-toggle[aria-pressed='true'] {
        color: var(--text);
        border-color: #39d98a;
      }

      #sound-toggle:focus-visible {
        outline: 2px solid #39d98a;
        outline-offset: 2px;
      }

      /* The reality check: a jurisdiction-mandated pause, so it outranks everything else drawn. */
      #reality-check {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-content: center;
        gap: 16px;
        justify-items: center;
        background: rgba(4, 8, 20, 0.88);
        text-align: center;
      }

      #reality-check[hidden] {
        display: none;
      }

      #reality-check h2 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.14em;
      }

      #reality-check p {
        margin: 0;
        max-width: 36ch;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      #reality-check button {
        padding: 10px 26px;
        border: 1px solid #39d98a;
        border-radius: 999px;
        background: #39d98a;
        color: #0b1020;
        font: 700 13px/1 inherit;
        letter-spacing: 0.1em;
        cursor: pointer;
      }

      #reality-check button:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }

      /* The keyboard's control panel (dom-controls.ts): the same controls as the Pixi panel, as
         real buttons. Transparent — the canvas is the visual — until keyboard focus arrives, when
         the focused control shows itself. Pointer events stay off so mouse players keep using the
         canvas and never discover an invisible button by accident. */
      .kbd-controls {
        position: fixed;
        bottom: max(48px, calc(env(safe-area-inset-bottom) + 40px));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        z-index: 6;
      }

      .kbd-controls button {
        padding: 10px 16px;
        border: 1px solid #39d98a;
        border-radius: 999px;
        background: rgba(16, 24, 48, 0.92);
        color: var(--text);
        font: 700 12px/1 inherit;
        letter-spacing: 0.1em;
        opacity: 0;
        pointer-events: none;
      }

      .kbd-controls button:focus-visible {
        opacity: 1;
        outline: 2px solid #39d98a;
        outline-offset: 2px;
      }

      .kbd-controls button[disabled] {
        border-color: #2c3860;
        color: var(--muted);
      }

      /* The top-left cluster: the history drawer's launcher (every build) and the dev panel's
         (revealed by the wiring only when __DEV_TOOLS__ is on — a production build has neither
         the button's label nor the panel behind it). Same pill as the sound toggle. */
      .corner-left {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: max(10px, env(safe-area-inset-left));
        display: flex;
        gap: 8px;
        z-index: 5;
      }

      .corner-left button {
        padding: 8px 14px;
        border: 1px solid #2c3860;
        border-radius: 999px;
        background: rgba(16, 24, 48, 0.8);
        color: var(--muted);
        font: 600 11px/1 inherit;
        letter-spacing: 0.12em;
        cursor: pointer;
      }

      .corner-left button:focus-visible {
        outline: 2px solid #39d98a;
        outline-offset: 2px;
      }

      /* The shared drawer: one frame, two documents — the round history and the dev panel. A side
         panel rather than a modal: the game keeps running and stays visible beside it. */
      #drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 15;
        width: min(420px, 92vw);
        display: flex;
        flex-direction: column;
        background: rgba(10, 15, 32, 0.97);
        border-left: 1px solid #2c3860;
        padding: max(10px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom));
        overflow-y: auto;
      }

      #drawer[hidden] {
        display: none;
      }

      #drawer header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0 12px;
        border-bottom: 1px solid #2c3860;
      }

      #drawer h2 {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.14em;
      }

      #drawer-close {
        padding: 6px 12px;
        border: 1px solid #2c3860;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font: 600 11px/1 inherit;
        letter-spacing: 0.12em;
        cursor: pointer;
      }

      #drawer-close:focus-visible {
        outline: 2px solid #39d98a;
        outline-offset: 2px;
      }

      /* The history document. */
      .history-status,
      .history-retention {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .history-row {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        padding: 10px 0;
        border-bottom: 1px solid rgba(44, 56, 96, 0.5);
        font-size: 13px;
      }

      .history-when {
        color: var(--muted);
        flex-basis: 100%;
        font-size: 11px;
      }

      .history-win {
        color: var(--muted);
      }

      .history-win-paid {
        color: #39d98a;
        font-weight: 600;
      }

      .history-feature {
        color: #e8b339;
        font-size: 12px;
      }

      /* The dev panel's styling is deliberately NOT here: it ships inside @slot/dev-tools
         (DEVTOOLS_CSS) and is injected by the same compile-stripped branch that creates the
         panel — verify:strip holds this page to containing no trace of it. */

      /* Present to assistive technology, absent from the layout. Not `display: none` and not
         `visibility: hidden` — either of those removes the element from the accessibility tree,
         which is the one thing this element exists to be in. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        border: 0;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="boot">
      <div class="spinner"></div>
      <p id="boot-status">Connecting</p>
      <p id="boot-error"></p>
    </div>

    <!--
      The game is a canvas, which is a rectangle of pixels with nothing in the accessibility tree.
      This region is the whole screen-reader story: the client writes the balance, the stake, the win
      and what the machine is doing into it, and `aria-live="polite"` means those are announced
      between actions rather than interrupting one. `role="status"` rather than `alert`, because a
      slot narrating itself at alert priority would be unusable.
    -->
    <p id="a11y-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>

    <!-- Hidden until the client knows WebAudio exists; wired in game.ts, persisted as a preference. -->
    <button id="sound-toggle" type="button" aria-pressed="true" hidden>SOUND ON</button>

    <!--
      The drawer's launchers. HISTORY is player-facing and appears once the session is up. The DEV
      button is not here at all: dev-build wiring creates it, so a production page carries neither
      the button nor the panel it would open.
    -->
    <div class="corner-left">
      <button id="history-toggle" type="button" hidden>HISTORY</button>
    </div>

    <!--
      The shared drawer (drawer.ts): the round history and the dev panel are documents, and a
      document wants DOM — scroll, focus order, a screen-reader story — not canvas. Non-modal on
      purpose: the game stays visible and playable beside it.
    -->
    <aside id="drawer" role="dialog" aria-labelledby="drawer-title" hidden>
      <header>
        <h2 id="drawer-title"></h2>
        <button id="drawer-close" type="button">CLOSE</button>
      </header>
      <div id="drawer-body"></div>
    </aside>

    <!--
      The reality check (jurisdictionRules.realityCheckIntervalMs). DOM rather than canvas for the
      same reason the boot screen is: it must block and be readable regardless of what the game is
      doing — and a real <button> brings focus and Enter/Space with it. Time only, deliberately: a
      money figure here would be the client summing amounts into a player-facing number (ADR-0001).
    -->
    <div id="reality-check" role="dialog" aria-modal="true" aria-labelledby="reality-title" hidden>
      <h2 id="reality-title">REALITY CHECK</h2>
      <p id="reality-message">You have been playing for a while.</p>
      <button id="reality-continue" type="button">CONTINUE</button>
    </div>

    <!-- Play money only. No real money, no payments, no crypto — stated where a player sees it. -->
    <p class="notice">18+ · Demo · Play money only — no real money and no payments</p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
