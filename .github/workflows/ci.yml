name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The Postgres the R1 store-contract tests run against. The tests are env-gated
      # (RGS_TEST_DATABASE_URL) and skip by name when it is absent — here it never is, so
      # "the database enforces what the memory store promises" is asserted on every push.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RGS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (incl. dependency boundaries)
        run: pnpm run lint

      # Before typecheck and the root suites: packages resolve each other through dist/, so both
      # read declarations that only exist once the workspace has been built.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Root suites (boundary rules fire, purity rules fire, the seam is wired)
        run: pnpm run test:root

      # The switch-over gate: one suite, every registered target. A target that cannot run says so
      # by name in the output rather than being quietly left out.
      - name: Contract suite
        run: pnpm run test:contract

      - name: Formatting
        run: pnpm run format:check
