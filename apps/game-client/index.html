<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aurora Reels — demo</title>
    <style>
      :root {
        color-scheme: dark;
        --backdrop: #0b1020;
        --text: #e8ecf8;
        --muted: #8d97b8;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--backdrop);
        color: var(--text);
        font-family:
          'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', system-ui, sans-serif;
        overscroll-behavior: none;
      }

      #game {
        position: fixed;
        inset: 0;
      }

      #game canvas {
        display: block;
      }

      /* The loading state is DOM rather than canvas on purpose: it has to be visible before Pixi,
         the atlas or the session exist — which is exactly the window it covers. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 14px;
        justify-items: center;
        background: var(--backdrop);
        transition: opacity 240ms ease;
      }

      #boot[hidden] {
        display: none;
      }

      #boot.done {
        opacity: 0;
        pointer-events: none;
      }

      .spinner {
        width: 42px;
        height: 42px;
        border: 3px solid #2c3860;
        border-top-color: #39d98a;
        border-radius: 50%;
        animation: turn 900ms linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 3s;
        }
      }

      @keyframes turn {
        to {
          transform: rotate(1turn);
        }
      }

      #boot-status,
      .notice {
        font-size: 13px;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .notice {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(10px, env(safe-area-inset-bottom));
        text-align: center;
        font-size: 11px;
        pointer-events: none;
      }

      #boot-error {
        max-width: 34ch;
        text-align: center;
        color: #ff6b6b;
        font-size: 13px;
        line-height: 1.5;
        text-transform: none;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>

    <div id="boot">
      <div class="spinner"></div>
      <p id="boot-status">Connecting</p>
      <p id="boot-error"></p>
    </div>

    <!-- Play money only. No real money, no payments, no crypto — stated where a player sees it. -->
    <p class="notice">18+ · Demo · Play money only — no real money and no payments</p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
