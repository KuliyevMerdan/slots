name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The Postgres the R1 store-contract tests run against. The tests are env-gated
      # (RGS_TEST_DATABASE_URL) and skip by name when it is absent — here it never is, so
      # "the database enforces what the memory store promises" is asserted on every push.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RGS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (incl. dependency boundaries)
        run: pnpm run lint

      # Before typecheck and the root suites: packages resolve each other through dist/, so both
      # read declarations that only exist once the workspace has been built.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Root suites (boundary rules fire, purity rules fire, the seam is wired)
        run: pnpm run test:root

      # The switch-over gate: one suite, every registered target. A target that cannot run says so
      # by name in the output rather than being quietly left out.
      - name: Contract suite
        run: pnpm run test:contract

      - name: Formatting
        run: pnpm run format:check

  # The E2E suite (C8): the deployed artifact's exact shape — the demo bundle served by mock-rgs
  # from one origin (ADR-0010) — driven like a player in a real browser: spin, win, feature,
  # reload-and-resume, with the money agreeing at every rest.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The suite reaches @slot/mock-rgs through dist/, and its webServer builds the demo bundle.
      - name: Build
        run: pnpm run build

      - name: E2E
        run: pnpm e2e

      - name: Keep the evidence when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # The containerized build (R7): the image is part of what a push must keep green. Build only —
  # the tests above already prove the code; this proves the Dockerfile still produces it.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -f apps/rgs/Dockerfile .

      - name: Build the demo image (client + mock-rgs, one origin — ADR-0010)
        run: docker build -f apps/mock-rgs/Dockerfile .
